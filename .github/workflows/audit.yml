name: Audit gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fuzz_suites:
        description: 'Comma-separated fuzz suites to run (e.g. net,poll). Empty skips fuzzing; no all/* wildcard.'
        required: false
        default: ''
        type: string

concurrency:
  group: >-
    audit-fast-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' ||
      github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch pull-request base commit
        if: github.event_name == 'pull_request'
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if P1=$(git rev-parse --verify --quiet HEAD^1 2>/dev/null) && git rev-parse --verify --quiet HEAD^2 >/dev/null 2>&1 && ! git rev-parse --verify --quiet HEAD^3 >/dev/null 2>&1; then
            BASE="$P1"
          else
            BASE=$(python3 -c 'import os,re,subprocess; h=subprocess.check_output(["git","cat-file","commit","HEAD"]).split(b"\n\n",1)[0]; ps=[m.group(1).decode() for l in h.split(b"\n") if (m:=re.fullmatch(rb"parent ([0-9a-f]{40})",l))]; print(ps[0] if len(ps)==2 else os.environ.get("RECORDED_BASE",""))')
          fi
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "INVALID_BASE_SHA: $BASE" >&2; exit 2; }
          git fetch --no-tags --depth=1 origin -- "$BASE"
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"

      - name: Check spec-change mark
        if: github.event_name == 'pull_request'
        run: python3 -B scripts/check_spec_change.py --base "$BASE_SHA" --head HEAD --event-path "$GITHUB_EVENT_PATH"

      - name: Run spec-change ratchet unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Prepare runner packages, sandbox cgroup, and concurrency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap strace uidmap python3-zstandard zstd xz-utils gzip curl libssl-dev
          [[ ! -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          U="$(id -un)"
          for f in /etc/subuid /etc/subgid; do
            if ! grep -q "^${U}:" "$f" 2>/dev/null; then
              S=$(awk -F: 'NF>=3 { if ($2+$3>m) m=$2+$3 } END { print m?m:100000 }' "$f" 2>/dev/null || echo 100000)
              flag=${f#/etc/sub}
              sudo usermod "--add-sub${flag}s" "${S}-$((S+65535))" "$U"
            fi
          done
          if [[ -f /sys/fs/cgroup/cgroup.controllers ]]; then
            echo "+memory +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null 2>&1 || true
            sudo mkdir -p /sys/fs/cgroup/leanswe/runner &&
              echo "+memory +pids" | sudo tee /sys/fs/cgroup/leanswe/cgroup.subtree_control >/dev/null &&
              sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/leanswe || true
          fi
          JOBS=$(python3 -c 'import os; print(max(1, min(os.cpu_count() or 2, 4)))')
          echo "LEAN_JOBS=$JOBS" >> "$GITHUB_ENV"
          echo "RUNNER_INFO: cpus=$(nproc) lean_jobs=$JOBS"
          free -m
          df -h /

      - name: Restore Lean packages cache
        id: lake-pkgs-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain', './lake-manifest.json', './proofs/lake-manifest.json') }}

      - name: Restore build folder cache
        id: lake-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ./.lake/build
            ./proofs/.lake/build
            ./harness/.lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-

      - name: Prune orphaned Lean build artifacts
        run: |
          python3 -c '
          from pathlib import Path
          import shutil
          for lib, base, roots in (
              (Path(".lake/build/lib/lean"), Path("."), ("Core", "LeanSwe", "Fuzz")),
              (Path("proofs/.lake/build/lib/lean"), Path("proofs"), ("LeanSwe", "LeanSweProofs")),
              (Path("harness/.lake/build/lib/lean"), Path("harness"), ("Fuzz", "ModelMutants", "UnitTests")),
          ):
              for r in roots:
                  if not (lr := lib / r).exists(): continue
                  if not (base / r).is_dir():
                      shutil.rmtree(lr)
                      continue
                  for o in list(lr.rglob("*.olean")):
                      if not (base / o.relative_to(lib).with_suffix(".lean")).is_file():
                          for ext in (".olean", ".olean.hash", ".olean.server", ".olean.private", ".ilean", ".ilean.hash", ".trace"): o.with_suffix(ext).unlink(missing_ok=True)
          '

      - name: Install Lean toolchain
        uses: ./.github/actions/install-lean

      - name: Check Lean import policy
        run: |
          set -euo pipefail
          lean -DwarningAsError=true --run scripts/CheckImports.lean --self-test
          lean -DwarningAsError=true --run scripts/CheckImports.lean .

      - name: Install Rust toolchain, Charon, and Aeneas
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 180 -o "$RUNNER_TEMP/rustup-init" https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
            echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init" && "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH" && export PATH="$HOME/.cargo/bin:$PATH"
          fi
          (cd LeanSwe/PostFork/rust && rustup show active-toolchain >/dev/null 2>&1 || rustup toolchain install nightly-2026-09-17 --profile minimal --component rustc-dev llvm-tools rust-src)
          mkdir -p "$RUNNER_TEMP/aeneas-dist"
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 180 -o "$RUNNER_TEMP/aeneas.tar.gz" https://github.com/AeneasVerif/aeneas/releases/download/nightly-2026.11.11-0d21a9e/aeneas-linux-x86_64.tar.gz
          echo "471047623451a0bd8c885dbd63bb660d0168e23c5393cf184f884091ff7c9233  $RUNNER_TEMP/aeneas.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/aeneas.tar.gz" -C "$RUNNER_TEMP/aeneas-dist" && echo "$RUNNER_TEMP/aeneas-dist" >> "$GITHUB_PATH"

      - name: Verify PostFork Rust build and Charon/Aeneas 0-diff extraction
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pf-regen"
          mkdir -p "$RUNNER_TEMP/pf-regen"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/pf-cargo-target"
          (cd LeanSwe/PostFork/rust && cargo build --locked --release --features standalone && charon cargo --preset aeneas --opaque postfork::sys --dest-file "$RUNNER_TEMP/pf-regen/postfork.llbc")
          aeneas -backend lean -split-files -subdir LeanSweProofs.PostFork.Aeneas -use-lean-modules false -dest "$RUNNER_TEMP/pf-regen" "$RUNNER_TEMP/pf-regen/postfork.llbc"
          diff -u proofs/LeanSweProofs/PostFork/Aeneas/Types.lean "$RUNNER_TEMP/pf-regen/LeanSweProofs.PostFork.Aeneas/Types.lean"
          diff -u proofs/LeanSweProofs/PostFork/Aeneas/Funs.lean "$RUNNER_TEMP/pf-regen/LeanSweProofs.PostFork.Aeneas/Funs.lean"

      - name: Build Lean libraries and tests
        id: build
        run: |
          set -euo pipefail
          lake -d proofs exe cache get
          LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake build --wfail
          LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake -d proofs build --wfail
          LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake -d proofs build --wfail LeanSweProofs.PostFork.Verified
          LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake -d harness build --wfail ModelMutants UnitTests leanswe-fuzz
          actual_syms=$(nm -u .lake/build/lib/libleanswe_postfork_rust.a | awk '$1 ~ /^[Uuwv]$/ { print $2 }' | sort -u)
          expected_syms=$(printf '%s\n' __errno_location _exit chdir close dup2 execve fcntl open read setpgid syscall write | sort -u)
          expected_c_syms=$(printf '%s\n' leanswe_postfork_host_close_fd leanswe_postfork_host_fork_run leanswe_postfork_host_pipe_cloexec leanswe_postfork_host_probe_fd leanswe_postfork_host_probe_handle leanswe_postfork_host_read_once leanswe_postfork_host_setpgid leanswe_postfork_host_wait_once leanswe_postfork_host_write_once | sort -u)
          diff -u <(printf '%s\n' "$expected_syms") <(printf '%s\n' "$actual_syms")
          diff -u <(printf '%s\n' leanswe_postfork_close_fds_above2_except leanswe_postfork_run_child) <(nm --defined-only .lake/build/lib/libleanswe_postfork_rust.a | awk '$2 ~ /^[A-Z]$/ { print $3 }' | sort -u)
          diff -u <(printf '%s\n' "$expected_c_syms") <(nm --defined-only .lake/build/lib/libleanswe_postfork.a | awk '$2 ~ /^[ABCDGRST]$/ { print $3 }' | sort -u)
          for b in leanswe-fuzz; do
            readelf -d "harness/.lake/build/bin/$b" | grep -E '^[[:space:]]*0x[0-9a-fA-F]+[[:space:]]+(\(BIND_NOW\)([[:space:]]|$)|\(FLAGS\)[[:space:]](.*[[:space:]])?BIND_NOW([[:space:]]|$)|\(FLAGS_1\)[[:space:]](.*[[:space:]])?NOW([[:space:]]|$))' >/dev/null || {
              echo "ERROR: harness/.lake/build/bin/$b missing ELF BIND_NOW" >&2
              exit 1
            }
          done

      - name: Save Lean packages cache
        if: >-
          !cancelled() &&
          steps.lake-pkgs-cache.outputs.cache-hit != 'true' &&
          steps.build.outcome == 'success' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain', './lake-manifest.json', './proofs/lake-manifest.json') }}

      - name: Save build folder cache
        if: >-
          !cancelled() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.lake-cache.outputs.cache-hit != 'true' &&
          steps.build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ./.lake/build
            ./proofs/.lake/build
            ./harness/.lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ github.sha }}

      - name: Run post-build audit checks in parallel
        run: |
          set -euo pipefail
          if [[ -f /sys/fs/cgroup/leanswe/runner/cgroup.procs ]]; then
            printf '%s\n' "$$" | sudo -n tee /sys/fs/cgroup/leanswe/runner/cgroup.procs >/dev/null || true
          fi
          python3 -c '
          import ctypes, os, pathlib, subprocess
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.argtypes = [ctypes.c_long, ctypes.c_void_p, ctypes.c_size_t, ctypes.c_uint32]
          libc.syscall.restype = ctypes.c_long
          ll = libc.syscall(444, None, 0, 1)
          lsm = pathlib.Path("/sys/kernel/security/lsm").read_text().strip() if pathlib.Path("/sys/kernel/security/lsm").exists() else "n/a"
          cg = pathlib.Path("/proc/self/cgroup").read_text().strip()
          bw = subprocess.run(["bwrap", "--ro-bind", "/", "/", "--dev", "/dev", "--proc", "/proc", "--tmpfs", "/tmp", "--unshare-all", "--", "/bin/true"], capture_output=True, text=True)
          line = f"SANDBOX_PROBE: kernel={os.uname().release} landlock_abi={ll} lsm={lsm} cgroup={cg} bwrap_rc={bw.returncode}"
          print(line)
          if bw.returncode != 0:
              print("SANDBOX_PROBE_BWRAP_ERR:", bw.stderr.strip())
          s = os.environ.get("GITHUB_STEP_SUMMARY")
          if s:
              with open(s, "a", encoding="utf-8") as f:
                  f.write(f"`{line}`\n\n")
          '
          OWN_LOG_DIR=""
          if [[ -n "${RUNNER_TEMP:-}" ]]; then
            LOG_DIR="$RUNNER_TEMP"
            mkdir -p "$LOG_DIR"
          else
            OWN_LOG_DIR=$(mktemp -d /tmp/audit-lanes.XXXXXX)
            LOG_DIR="$OWN_LOG_DIR"
          fi
          LANE_STATE_DIR=$(mktemp -d "$LOG_DIR/audit-state.XXXXXX")
          LAKE_ENV_FILE="$LANE_STATE_DIR/lake.env"
          LANE_PIDS=()
          cleanup_parallel() {
            local p sig
            set +m
            if (( ${#LANE_PIDS[@]} > 0 )); then
              for sig in TERM KILL; do
                for p in "${LANE_PIDS[@]}"; do [[ "$p" =~ ^[1-9][0-9]*$ && "$p" -gt 1 ]] && kill "-$sig" -- -"$p" 2>/dev/null || true; done
                [[ "$sig" == TERM ]] && sleep 0.1 || true
              done
              wait "${LANE_PIDS[@]}" 2>/dev/null || true
              LANE_PIDS=()
            fi
            rm -rf "$LANE_STATE_DIR"
            [[ -z "$OWN_LOG_DIR" ]] || rm -rf "$OWN_LOG_DIR"
          }
          trap cleanup_parallel EXIT
          trap 'trap "" INT TERM; cleanup_parallel; exit 130' INT
          trap 'trap "" INT TERM; cleanup_parallel; exit 143' TERM
          # Capture lake -d proofs env once before launching lanes so LEAN_PATH covers both Layer 1 and Layer 2.
          lake -d proofs env python3 -c '
          import os, re, shlex
          for k, v in sorted(os.environ.items()):
              if k == "LEAN_RECURSION_COUNT": continue
              if re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", k) and (k.startswith(("ELAN", "LAKE", "LEAN")) or k in ("PATH", "LD_LIBRARY_PATH", "DYLD_LIBRARY_PATH")):
                  print(f"export {k}={shlex.quote(v)}")
          ' > "$LAKE_ENV_FILE"
          [[ -s "$LAKE_ENV_FILE" ]] || { echo "LAKE_ENV_ERROR: failed to capture lake env" >&2; exit 2; }
          run_lean_gate() {
            ( set -euo pipefail; source "$LAKE_ENV_FILE"; exec env LEAN_NUM_THREADS=1 lean -DwarningAsError=true --run "$@" )
          }
          lane_1() {
            run_lean_gate scripts/CheckAssumptionsTest.lean
          }
          lane_2() {
            run_lean_gate scripts/CheckPromises.lean --with-self-test .lake/build/lib/lean .
          }
          lane_3() {
            run_lean_gate scripts/CheckAssumptions.lean
          }
          lane_4() {
            run_lean_gate scripts/CheckForeignThinness.lean .
          }
          LANE_LABELS=(
            "Lane 1: CheckAssumptionsTest"
            "Lane 2: CheckPromises + CheckPromisesTest"
            "Lane 3: CheckAssumptions"
            "Lane 4: CheckForeignThinness"
          )
          LANE_LOGS=()
          LANE_TFILES=()
          WALL_T0="$SECONDS"
          for i in 1 2 3 4; do
            log="$LOG_DIR/lane-${i}.log"
            tf="$LANE_STATE_DIR/lane-${i}.sec"
            rm -f "$log" "$tf"
            LANE_LOGS+=("$log")
            LANE_TFILES+=("$tf")
            set -m
            (
              set +m
              trap - INT TERM
              set -euo pipefail
              ( trap '' INT TERM; exec sleep 86400 ) </dev/null >/dev/null 2>&1 &
              _t0="$SECONDS"
              _tf="$tf"
              trap 'printf "%s\n" "$((SECONDS - _t0))" > "$_tf" 2>/dev/null || true' EXIT
              "lane_${i}"
            ) </dev/null >"$log" 2>&1 &
            LANE_PIDS+=("$!")
            set +m
          done
          FAIL_RC=0
          LANE_RCS=()
          for idx in 0 1 2 3; do
            rc=0
            wait "${LANE_PIDS[$idx]}" || rc=$?
            kill -TERM -- -"${LANE_PIDS[$idx]}" 2>/dev/null || true
            kill -KILL -- -"${LANE_PIDS[$idx]}" 2>/dev/null || true
            unset "LANE_PIDS[$idx]"
            LANE_RCS+=("$rc")
            if (( rc != 0 && FAIL_RC == 0 )); then
              FAIL_RC=$rc
            fi
          done
          LANE_PIDS=()
          WALL_SEC="$((SECONDS - WALL_T0))"
          for idx in 0 1 2 3; do
            rc="${LANE_RCS[$idx]}"
            dur="unknown"
            if [[ -s "${LANE_TFILES[$idx]}" ]]; then
              raw_dur="$(< "${LANE_TFILES[$idx]}")"
              if [[ "$raw_dur" =~ ^[0-9]+$ ]]; then
                dur="${raw_dur}s"
              fi
            fi
            status="PASS"
            if (( rc >= 129 && rc <= 192 )); then
              status="FAIL(rc=${rc},sig=$((rc - 128)))"
            elif (( rc != 0 )); then
              status="FAIL(rc=${rc})"
            fi
            echo "::group::${LANE_LABELS[$idx]} [${status}, ${dur}]"
            if [[ -s "${LANE_LOGS[$idx]}" ]]; then
              cat "${LANE_LOGS[$idx]}"
              [[ "$(tail -c 1 "${LANE_LOGS[$idx]}" | wc -l)" -eq 1 ]] || echo
            fi
            echo "::endgroup::"
            if (( rc != 0 )); then
              echo "::error::${LANE_LABELS[$idx]} failed (${status}, ${dur})"
            fi
          done
          echo "PARALLEL_AUDIT_GATES: wall=${WALL_SEC}s l1_rc=${LANE_RCS[0]} l2_rc=${LANE_RCS[1]} l3_rc=${LANE_RCS[2]} l4_rc=${LANE_RCS[3]}"
          exit "$FAIL_RC"

      - name: Run opt-in fuzz suites
        id: fuzz_gate
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          INPUT_FUZZ_SUITES: ${{ inputs.fuzz_suites }}
        run: |
          set -euo pipefail
          FUZZ_BIN="harness/.lake/build/bin/leanswe-fuzz"
          VALID_RAW=$("$FUZZ_BIN" --list-suites)
          [[ -n "$VALID_RAW" ]] || { echo "FUZZ_GATE_ERROR: empty --list-suites output" >&2; exit 2; }
          SELECTED_RAW=$(python3 -B -c '
          import json, os, sys
          valid = list(dict.fromkeys(ln.strip() for ln in sys.argv[1].splitlines() if ln.strip()))
          valid_set, valid_csv = set(valid), ",".join(valid)
          order = {s: i for i, s in enumerate(valid)}
          ev = os.environ.get("GITHUB_EVENT_NAME", "")
          selected = []
          def fail(msg):
              print(f"FUZZ_GATE_ERROR: {msg} (valid suites: {valid_csv})", file=sys.stderr)
              sys.exit(2)
          if ev == "pull_request":
              raw = os.environ.get("PR_LABELS_JSON", "").strip()
              if raw in ("", "null"):
                  labels = []
              else:
                  try:
                      labels = json.loads(raw)
                  except json.JSONDecodeError as e:
                      fail(f"invalid PR_LABELS_JSON: {e}")
                  if not isinstance(labels, list) or not all(isinstance(x, str) for x in labels):
                      fail("PR_LABELS_JSON must be a JSON array of strings")
              seen = set()
              for lbl in labels:
                  low = lbl.strip().lower()
                  if low == "run-fuzz":
                      fail(f"bare label {lbl!r} is forbidden; use explicit run-fuzz:<suite> labels")
                  if low.startswith("run-fuzz:"):
                      if not lbl.startswith("run-fuzz:"):
                          fail(f"invalid prefix casing/whitespace in fuzz label {lbl!r}")
                      name = lbl[len("run-fuzz:"):]
                      if not name or not name.strip() or name.strip().lower() in ("all", "*"):
                          fail(f"wildcard/empty fuzz label {lbl!r} is forbidden; use explicit run-fuzz:<suite> labels")
                      if name not in valid_set:
                          fail(f"unknown fuzz suite label {lbl!r}")
                      if name not in seen:
                          seen.add(name)
                          selected.append(name)
          elif ev == "workflow_dispatch":
              raw = os.environ.get("INPUT_FUZZ_SUITES", "").strip()
              if raw:
                  seen = set()
                  for tok in raw.split(","):
                      name = tok.strip()
                      if not name:
                          fail(f"empty suite entry in fuzz_suites {raw!r}")
                      if name.lower() in ("all", "*"):
                          fail(f"wildcard/all token {name!r} is forbidden in fuzz_suites")
                      if name not in valid_set:
                          fail(f"unknown fuzz suite {name!r} in fuzz_suites")
                      if name in seen:
                          fail(f"duplicate fuzz suite {name!r} in fuzz_suites")
                      seen.add(name)
                      selected.append(name)
          elif ev == "push":
              pass
          else:
              fail(f"unsupported GITHUB_EVENT_NAME={ev!r}")
          selected.sort(key=order.__getitem__)
          if selected:
              print("\n".join(selected))
          ' "$VALID_RAW")
          SELECTED_SET=","
          LIGHT_ARGS=()
          STDIO_ARGS=()
          has_suite() { [[ "$SELECTED_SET" == *",$1,"* ]]; }
          while IFS= read -r _s; do
            [[ -n "$_s" ]] || continue
            [[ "$_s" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || { echo "FUZZ_GATE_ERROR: invalid suite '$_s'" >&2; exit 2; }
            if has_suite "$_s"; then
              continue
            fi
            SELECTED_SET+="${_s},"
            case "$_s" in
              sandbox|timerand|files|process|poll|net|postfork) ;;
              *) LIGHT_ARGS+=(--suite "$_s") ;;
            esac
            case "$_s" in
              sandbox|timerand|files|process|poll|net|passwd|dns) STDIO_ARGS+=(--suite "$_s") ;;
            esac
          done <<< "$SELECTED_RAW"
          SUMMARY="${SELECTED_SET#,}"
          SUMMARY="${SUMMARY%,}"
          echo "FUZZ_GATE: mode=opt-in event=${GITHUB_EVENT_NAME:-unknown} selected_suites=${SUMMARY:-none}"
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "run_files=$(has_suite files && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi
          if (( ${#STDIO_ARGS[@]} > 0 )); then
            "$FUZZ_BIN" --smoke "${STDIO_ARGS[@]}" --self-test-shrink 0<&- 1>&- 2>&-
          fi
          if (( ${#LIGHT_ARGS[@]} > 0 )); then
            "$FUZZ_BIN" --smoke "${LIGHT_ARGS[@]}" --self-test-shrink
          fi
          if has_suite sandbox; then
            "$FUZZ_BIN" --sandbox-strace-fault-check
            "$FUZZ_BIN" --suite sandbox --steps 100000 --self-test-shrink
            "$FUZZ_BIN" --suite sandbox --steps 50000 --random-seed --self-test-shrink
            if sudo -n sysctl -n vm.memfd_noexec >/dev/null 2>&1; then
              OLD_MEMFD_NOEXEC=$(sudo -n sysctl -n vm.memfd_noexec)
              sudo -n unshare --pid --fork --mount-proc -- bash -ec '
                ulimit -Hc unlimited
                if (( $1 == 2 )); then
                  echo "MEMFD_NOEXEC_WARN: vm.memfd_noexec=2 enforced; skipping vm.memfd_noexec=1"
                else
                  sysctl -w vm.memfd_noexec=1 >/dev/null
                  setpriv --reuid="$2" --regid="$3" --init-groups -- harness/.lake/build/bin/leanswe-fuzz --suite sandbox --steps 50000 --random-seed --self-test-shrink
                  sysctl -w vm.memfd_noexec=2 >/dev/null
                fi
                setpriv --reuid="$2" --regid="$3" --init-groups -- harness/.lake/build/bin/leanswe-fuzz --suite sandbox --steps 50000 --random-seed --self-test-shrink --require-memfd-strict
                sysctl -w "vm.memfd_noexec=$1" >/dev/null 2>&1 || true
              ' _ "$OLD_MEMFD_NOEXEC" "$(id -u)" "$(id -g)"
            else
              echo "::warning::sudo -n sysctl unavailable; skipping vm.memfd_noexec={1,2} strict checks"
            fi
          fi
          if has_suite timerand; then
            "$FUZZ_BIN" --timerand-strace-fault-check
            "$FUZZ_BIN" --suite timerand --steps 100000 --self-test-shrink
            "$FUZZ_BIN" --suite timerand --steps 100000 --random-seed --self-test-shrink
          fi
          if has_suite process; then
            "$FUZZ_BIN" --process-strace-fault-check
            "$FUZZ_BIN" --suite process --steps 15000 --self-test-shrink --require-ns
            "$FUZZ_BIN" --suite process --steps 5000 --random-seed --self-test-shrink --require-ns
          fi
          if has_suite poll; then
            "$FUZZ_BIN" --poll-strace-fault-check
            "$FUZZ_BIN" --suite poll --steps 50000 --self-test-shrink
            "$FUZZ_BIN" --suite poll --steps 50000 --random-seed --self-test-shrink
          fi
          if has_suite net; then
            "$FUZZ_BIN" --net-strace-fault-check
            "$FUZZ_BIN" --suite net --steps 50000 --self-test-shrink --require-ns
            "$FUZZ_BIN" --suite net --seed 11262680905236430927 --steps 50000 --self-test-shrink --require-ns
            "$FUZZ_BIN" --suite net --steps 50000 --random-seed --self-test-shrink --require-ns
          fi
          if has_suite postfork; then
            "$FUZZ_BIN" --suite postfork --steps 25000 --self-test-shrink
            "$FUZZ_BIN" --suite postfork --steps 25000 --random-seed --self-test-shrink
            "$FUZZ_BIN" --suite postfork --steps 500 --self-test-shrink 0<&- >/dev/null
          fi

      - name: Run world-model differential fuzzer (Files)
        if: success() && steps.fuzz_gate.outcome == 'success' && steps.fuzz_gate.outputs.run_files == 'true'
        run: |
          set -euo pipefail
          harness/.lake/build/bin/leanswe-fuzz --files-strace-fault-check
          harness/.lake/build/bin/leanswe-fuzz --suite files --steps 100000 --self-test-shrink --require-ns
          harness/.lake/build/bin/leanswe-fuzz --suite files --steps 50000 --random-seed --require-ns
          command -v capsh >/dev/null 2>&1 || { echo "ERROR: missing capsh" >&2; exit 1; }
          unshare -Urm sh -c '
            set -e; T=$(mktemp -d /tmp/gh-ovl.XXXXXX)
            trap "for p in \"$T/ro/s1777/u65534\" \"$T/ro\" \"$T/mnt\" \"$T/ul_mnt\" \"$T/root/proc\" \"$T/root/dev\" \"$T/m\"; do umount -l \"\$p\" 2>/dev/null || true; done; rm -rf \"$T\"" EXIT
            mkdir -p "$T/low" "$T/up" "$T/wk" "$T/mnt" "$T/x" "$T/m" "$T/ro_src" "$T/ro" "$T/ul_low/shrink" "$T/ul_up" "$T/ul_wk" "$T/ul_mnt" "$T/root/dev" "$T/root/proc" "$T/root/etc" "$T/root/sys/kernel/debug" "$T/out"
            ./harness/.lake/build/bin/leanswe-fuzz --seed-overlay-lower "$T/low" 250; mount -t overlay overlay -o "lowerdir=$T/low,upperdir=$T/up,workdir=$T/wk,userxattr" "$T/mnt"; mount -t tmpfs tmpfs "$T/m"
            ./harness/.lake/build/bin/leanswe-fuzz --worker-mode rw --host-protected --dir "$T/m" --steps 5000 --assert-worker-hits < /dev/null
            ./harness/.lake/build/bin/leanswe-fuzz --worker-mode unlinked_cwd --host-protected --dir "$T/m" --steps 3000 --assert-worker-hits < /dev/null
            ./harness/.lake/build/bin/leanswe-fuzz --worker-mode seccomp --host-protected --dir "$T/m" --steps 3000 --assert-worker-hits < /dev/null
            ./harness/.lake/build/bin/leanswe-fuzz --seed-ro-tree "$T/ro_src"; : > "$T/ro_src/s1777/u65534"; mount --bind "$T/ro_src" "$T/ro"; mount -o remount,ro,bind "$T/ro"; mount --bind /etc/passwd "$T/ro/s1777/u65534"; mount -o remount,ro,bind "$T/ro/s1777/u65534"
            ./harness/.lake/build/bin/leanswe-fuzz --worker-mode ro_bind --host-protected --dir "$T/ro" --steps 3000 --assert-worker-hits < /dev/null
            mount --rbind /dev "$T/root/dev"; mount --rbind /proc "$T/root/proc"; cp /etc/passwd "$T/root/etc/passwd"; : > "$T/root/sys/kernel/cpu_byteorder"
            ./harness/.lake/build/bin/leanswe-fuzz --worker-mode chroot --host-protected --dir "$T/out" --chroot-dir "$T/root" --steps 3000 --assert-worker-hits < /dev/null
            i=0; while [ "$i" -lt 90 ]; do mkdir -p "$T/ul_low/ep-$i"; i=$((i+1)); done; j=0; while [ "$j" -lt 256 ]; do mkdir -p "$T/ul_low/shrink-$j"; j=$((j+1)); done
            : > "$T/ul_low/.ovl_unlinked"; mount -t overlay overlay -o "lowerdir=$T/ul_low,upperdir=$T/ul_up,workdir=$T/ul_wk,userxattr" "$T/ul_mnt"
            capsh --drop=cap_dac_override,cap_dac_read_search,cap_fowner,cap_fsetid -- -c "./harness/.lake/build/bin/leanswe-fuzz --worker-mode unlinked_cwd --host-protected --preseeded-eps --dir \"$T/ul_mnt\" --steps 3000 --assert-worker-hits < /dev/null"
            capsh --drop=cap_dac_override,cap_dac_read_search,cap_fowner,cap_fsetid -- -c "./harness/.lake/build/bin/leanswe-fuzz --worker-mode rw --host-protected --preseeded-eps --dir \"$T/mnt\" --cross-dir \"$T/x\" --steps 10000 --assert-worker-hits < /dev/null"
          '
