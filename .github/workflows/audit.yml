name: Audit gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: >-
    audit-fast-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' ||
      github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch pull-request base commit
        if: github.event_name == 'pull_request'
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if P1=$(git rev-parse --verify --quiet HEAD^1 2>/dev/null) && git rev-parse --verify --quiet HEAD^2 >/dev/null 2>&1 && ! git rev-parse --verify --quiet HEAD^3 >/dev/null 2>&1; then
            BASE="$P1"
          else
            BASE=$(python3 -c 'import os,re,subprocess; h=subprocess.check_output(["git","cat-file","commit","HEAD"]).split(b"\n\n",1)[0]; ps=[m.group(1).decode() for l in h.split(b"\n") if (m:=re.fullmatch(rb"parent ([0-9a-f]{40})",l))]; print(ps[0] if len(ps)==2 else os.environ.get("RECORDED_BASE",""))')
          fi
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "INVALID_BASE_SHA: $BASE" >&2; exit 2; }
          git fetch --no-tags --depth=1 origin -- "$BASE"
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"

      - name: Check spec-change mark
        if: github.event_name == 'pull_request'
        run: python3 -B scripts/check_spec_change.py --base "$BASE_SHA" --head HEAD --event-path "$GITHUB_EVENT_PATH"

      - name: Run spec-change ratchet unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Prepare runner packages, sandbox cgroup, and concurrency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap strace uidmap python3-zstandard zstd xz-utils gzip curl libssl-dev
          [[ ! -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; U="$(id -un)"; for f in /etc/subuid /etc/subgid; do grep -q "^${U}:" "$f" 2>/dev/null || { S=$(awk -F: 'NF>=3 { if ($2+$3>m) m=$2+$3 } END { print m?m:100000 }' "$f" 2>/dev/null || echo 100000); flag=${f#/etc/sub}; sudo usermod "--add-sub${flag}s" "${S}-$((S+65535))" "$U"; }; done
          if [[ -f /sys/fs/cgroup/cgroup.controllers ]]; then
            echo "+memory +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null 2>&1 || true
            sudo mkdir -p /sys/fs/cgroup/leanswe/runner &&
              echo "+memory +pids" | sudo tee /sys/fs/cgroup/leanswe/cgroup.subtree_control >/dev/null &&
              sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/leanswe || true
          fi
          JOBS=$(python3 -c 'import os; print(max(1, min(os.cpu_count() or 2, 4)))')
          echo "LEAN_JOBS=$JOBS" >> "$GITHUB_ENV"
          echo "RUNNER_INFO: cpus=$(nproc) lean_jobs=$JOBS"
          free -m
          df -h /

      - name: Restore build folder cache
        id: lake-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain', './lake-manifest.json', './lakefile.lean', 'LeanSwe/**/c/**', 'Fuzz/**/c/**') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain', './lake-manifest.json', './lakefile.lean', 'LeanSwe/**/c/**', 'Fuzz/**/c/**') }}-

      - name: Prune orphaned Lean build artifacts
        run: |
          python3 -c '
          from pathlib import Path
          for root in ("Core", "LeanSwe", "Fuzz"):
              lib_root = Path(".lake/build/lib/lean") / root
              if not lib_root.exists():
                  continue
              for olean in list(lib_root.rglob("*.olean")):
                  rel = olean.relative_to(".lake/build/lib/lean").with_suffix(".lean")
                  if not rel.is_file():
                      for ext in (".olean", ".olean.hash", ".olean.server", ".olean.private", ".ilean", ".ilean.hash", ".trace"):
                          olean.with_suffix(ext).unlink(missing_ok=True)
          '

      - name: Install Lean toolchain
        uses: ./.github/actions/install-lean

      - name: Build Lean libraries and tests
        id: build
        run: |
          set -euo pipefail
          LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake build --wfail
          LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake build --wfail lean-swe-mut-test leanswe-world-fuzz leanswe-fuzz

      - name: Run runtime test suites
        run: |
          set -euo pipefail
          if [[ -f /sys/fs/cgroup/leanswe/runner/cgroup.procs ]]; then
            printf '%s\n' "$$" | sudo -n tee /sys/fs/cgroup/leanswe/runner/cgroup.procs >/dev/null || true
          fi
          python3 -c '
          import ctypes, os, pathlib, subprocess
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.argtypes = [ctypes.c_long, ctypes.c_void_p, ctypes.c_size_t, ctypes.c_uint32]
          libc.syscall.restype = ctypes.c_long
          ll = libc.syscall(444, None, 0, 1)
          lsm = pathlib.Path("/sys/kernel/security/lsm").read_text().strip() if pathlib.Path("/sys/kernel/security/lsm").exists() else "n/a"
          cg = pathlib.Path("/proc/self/cgroup").read_text().strip()
          bw = subprocess.run(["bwrap", "--ro-bind", "/", "/", "--dev", "/dev", "--proc", "/proc", "--tmpfs", "/tmp", "--unshare-all", "--", "/bin/true"], capture_output=True, text=True)
          line = f"SANDBOX_PROBE: kernel={os.uname().release} landlock_abi={ll} lsm={lsm} cgroup={cg} bwrap_rc={bw.returncode}"
          print(line)
          if bw.returncode != 0:
              print("SANDBOX_PROBE_BWRAP_ERR:", bw.stderr.strip())
          s = os.environ.get("GITHUB_STEP_SUMMARY")
          if s:
              with open(s, "a", encoding="utf-8") as f:
                  f.write(f"`{line}`\n\n")
          '
          ASSUMP_NONCE=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          ASSUMP_LOG="${RUNNER_TEMP:-/tmp}/assump-${GITHUB_RUN_ID:-local}.log"
          rm -f "$ASSUMP_LOG"
          echo "ASSUMP_NONCE=$ASSUMP_NONCE" >> "$GITHUB_ENV"
          echo "ASSUMP_LOG=$ASSUMP_LOG" >> "$GITHUB_ENV"
          .lake/build/bin/lean-swe-test --assump-log "$ASSUMP_LOG" --assump-nonce "$ASSUMP_NONCE"
          .lake/build/bin/lean-swe-test --sandbox-strace-fault-check; .lake/build/bin/leanswe-world-fuzz --suite sandbox --steps 100000 --self-test-shrink; .lake/build/bin/leanswe-world-fuzz --suite sandbox --steps 50000 --random-seed --self-test-shrink
          if sudo -n sysctl -n vm.memfd_noexec >/dev/null 2>&1; then
            OLD_MEMFD_NOEXEC=$(sudo -n sysctl -n vm.memfd_noexec)
            sudo -n unshare --pid --fork --mount-proc -- bash -ec '
              ulimit -Hc unlimited; if (( $1 == 2 )); then echo "MEMFD_NOEXEC_WARN: vm.memfd_noexec=2 enforced; skipping vm.memfd_noexec=1"; else
                sysctl -w vm.memfd_noexec=1 >/dev/null; setpriv --reuid="$2" --regid="$3" --init-groups -- .lake/build/bin/leanswe-world-fuzz --suite sandbox --steps 50000 --random-seed --self-test-shrink; sysctl -w vm.memfd_noexec=2 >/dev/null
              fi
              setpriv --reuid="$2" --regid="$3" --init-groups -- .lake/build/bin/leanswe-world-fuzz --suite sandbox --steps 50000 --random-seed --self-test-shrink --require-memfd-strict
              sysctl -w "vm.memfd_noexec=$1" >/dev/null 2>&1 || true' _ "$OLD_MEMFD_NOEXEC" "$(id -u)" "$(id -g)"
          else
            echo "::warning::sudo -n sysctl unavailable; skipping vm.memfd_noexec={1,2} strict checks"
          fi
          .lake/build/bin/lean-swe-test --timerand-strace-fault-check; .lake/build/bin/lean-swe-test --suite CmdLine --suite EnvVars.Raw --suite EnvVars --suite CryptoHash.Raw --suite CryptoHash --suite LinuxSyscall.Sandbox --suite LinuxSyscall.TimeRand --suite LinuxSyscall.Passwd --suite LinuxSyscall.Dns --suite LinuxSyscall.Poll --suite LinuxSyscall.Net --suite LinuxSyscall.Process 0<&- 1>&- 2>&-
          .lake/build/bin/lean-swe-mut-test --mode full --suite LinuxSyscall.Sandbox,LinuxSyscall.TimeRand,LinuxSyscall.Poll,LinuxSyscall.Net,CmdLine,EnvVars.Raw,EnvVars,CryptoHash.Raw,CryptoHash,LinuxSyscall.Passwd,LinuxSyscall.Dns
          .lake/build/bin/leanswe-world-fuzz --suite timerand --steps 100000 --self-test-shrink; .lake/build/bin/leanswe-world-fuzz --suite timerand --steps 100000 --random-seed --self-test-shrink
          .lake/build/bin/lean-swe-mut-test --mode full --suite LinuxSyscall.Process; .lake/build/bin/lean-swe-test --process-strace-fault-check; .lake/build/bin/leanswe-world-fuzz --suite process --steps 15000 --self-test-shrink --require-ns; .lake/build/bin/leanswe-world-fuzz --suite process --steps 5000 --random-seed --self-test-shrink --require-ns
          python3 -B -m unittest scripts/test_fuzz_changed.py
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${BASE_SHA:-}" ]]; then
            python3 -B scripts/fuzz_changed.py --base "$BASE_SHA" --head HEAD --check-manifest --run --extra-arg=--self-test-shrink
          else
            python3 -B scripts/fuzz_changed.py --base HEAD --head HEAD --check-manifest
            .lake/build/bin/leanswe-fuzz --smoke --all --self-test-shrink
          fi
          .lake/build/bin/lean-swe-test --poll-strace-fault-check; .lake/build/bin/lean-swe-test --net-strace-fault-check; .lake/build/bin/leanswe-world-fuzz --suite poll --steps 50000 --self-test-shrink; .lake/build/bin/leanswe-world-fuzz --suite poll --steps 50000 --random-seed --self-test-shrink; .lake/build/bin/leanswe-world-fuzz --suite net --steps 50000 --self-test-shrink --require-ns; .lake/build/bin/leanswe-world-fuzz --suite net --seed 11262680905236430927 --steps 50000 --self-test-shrink --require-ns; .lake/build/bin/leanswe-world-fuzz --suite net --steps 50000 --random-seed --self-test-shrink --require-ns

      - name: Check 1 GB private-memory cap on changed modules and reverse dependents
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          DIFF_BASE="${BASE_SHA:-}"
          if [[ -z "$DIFF_BASE" && "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git fetch --no-tags --depth=1 origin -- "$PUSH_BEFORE" 2>/dev/null; then
              DIFF_BASE="$PUSH_BEFORE"
            fi
          fi
          if [[ -z "$DIFF_BASE" ]]; then
            echo "MEMORY_CHECK: no comparison base available; skipping incremental memory check"
            exit 0
          fi
          mapfile -t CHANGED_LEAN < <(
            git diff --name-only --diff-filter=ACMR "$DIFF_BASE" HEAD -- '*.lean' \
              | grep -vxF 'lakefile.lean' || true
          )
          if (( ${#CHANGED_LEAN[@]} == 0 )); then
            echo "MEMORY_CHECK: skipped (0 module .lean files changed against $DIFF_BASE)"
          else
            python3 -B scripts/check_proof_memory.py --with-revdeps --jobs "$LEAN_JOBS" -- "${CHANGED_LEAN[@]}"
          fi

      - name: Check spec promise theorem coverage
        run: lake env lean -DwarningAsError=true --run scripts/CheckPromises.lean .lake/build/lib/lean .

      - name: Check assumptions and error coverage
        run: lake env lean -DwarningAsError=true --run scripts/CheckAssumptions.lean --allow-legacy --verify-log "$ASSUMP_LOG" --nonce "$ASSUMP_NONCE"

      - name: Check non-Lean thinness gate
        run: lake env lean -DwarningAsError=true --run scripts/CheckForeignThinness.lean .

      - name: Save build folder cache
        if: >-
          !cancelled() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.lake-cache.outputs.cache-hit != 'true' &&
          steps.build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain', './lake-manifest.json', './lakefile.lean', 'LeanSwe/**/c/**', 'Fuzz/**/c/**') }}-${{ github.sha }}
