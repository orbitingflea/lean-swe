name: Audit gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: >-
    audit-fast-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' ||
      github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch pull-request base commit
        if: github.event_name == 'pull_request'
        env:
          RECORDED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if P1=$(git rev-parse --verify --quiet HEAD^1 2>/dev/null) && git rev-parse --verify --quiet HEAD^2 >/dev/null 2>&1 && ! git rev-parse --verify --quiet HEAD^3 >/dev/null 2>&1; then
            BASE="$P1"
          else
            BASE=$(python3 -c 'import os,re,subprocess; h=subprocess.check_output(["git","cat-file","commit","HEAD"]).split(b"\n\n",1)[0]; ps=[m.group(1).decode() for l in h.split(b"\n") if (m:=re.fullmatch(rb"parent ([0-9a-f]{40})",l))]; print(ps[0] if len(ps)==2 else os.environ.get("RECORDED_BASE",""))')
          fi
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "INVALID_BASE_SHA: $BASE" >&2; exit 2; }
          git fetch --no-tags --depth=1 origin -- "$BASE"
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"

      - name: Check spec-change mark
        if: github.event_name == 'pull_request'
        run: python3 -B scripts/check_spec_change.py --base "$BASE_SHA" --head HEAD --event-path "$GITHUB_EVENT_PATH"

      - name: Run spec-change ratchet unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Prepare runner packages, sandbox cgroup, and concurrency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap strace uidmap python3-zstandard zstd xz-utils gzip curl libssl-dev
          [[ ! -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; U="$(id -un)"; for f in /etc/subuid /etc/subgid; do grep -q "^${U}:" "$f" 2>/dev/null || { S=$(awk -F: 'NF>=3 { if ($2+$3>m) m=$2+$3 } END { print m?m:100000 }' "$f" 2>/dev/null || echo 100000); flag=${f#/etc/sub}; sudo usermod "--add-sub${flag}s" "${S}-$((S+65535))" "$U"; }; done
          if [[ -f /sys/fs/cgroup/cgroup.controllers ]]; then
            echo "+memory +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null 2>&1 || true
            sudo mkdir -p /sys/fs/cgroup/leanswe/runner &&
              echo "+memory +pids" | sudo tee /sys/fs/cgroup/leanswe/cgroup.subtree_control >/dev/null &&
              sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/leanswe || true
          fi
          JOBS=$(python3 -c 'import os; print(max(1, min(os.cpu_count() or 2, 4)))')
          echo "LEAN_JOBS=$JOBS" >> "$GITHUB_ENV"
          echo "RUNNER_INFO: cpus=$(nproc) lean_jobs=$JOBS"
          free -m
          df -h /

      - name: Restore Lean packages cache
        id: lake-pkgs-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain', './lake-manifest.json') }}

      - name: Restore build folder cache
        id: lake-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-

      - name: Prune orphaned Lean build artifacts
        run: |
          python3 -c '
          from pathlib import Path
          for root in ("Core", "LeanSwe", "Fuzz"):
              lib_root = Path(".lake/build/lib/lean") / root
              if not lib_root.exists():
                  continue
              for olean in list(lib_root.rglob("*.olean")):
                  rel = olean.relative_to(".lake/build/lib/lean").with_suffix(".lean")
                  if not rel.is_file():
                      for ext in (".olean", ".olean.hash", ".olean.server", ".olean.private", ".ilean", ".ilean.hash", ".trace"):
                          olean.with_suffix(ext).unlink(missing_ok=True)
          '

      - name: Install Lean toolchain
        uses: ./.github/actions/install-lean

      - name: Install Rust toolchain, Charon, and Aeneas
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 180 -o "$RUNNER_TEMP/rustup-init" https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
            echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init" && "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH" && export PATH="$HOME/.cargo/bin:$PATH"
          fi
          (cd LeanSwe/PostFork/rust && rustup show active-toolchain >/dev/null 2>&1 || rustup toolchain install nightly-2026-09-17 --profile minimal --component rustc-dev llvm-tools rust-src)
          mkdir -p "$RUNNER_TEMP/aeneas-dist"
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 180 -o "$RUNNER_TEMP/aeneas.tar.gz" https://github.com/AeneasVerif/aeneas/releases/download/nightly-2026.11.11-0d21a9e/aeneas-linux-x86_64.tar.gz
          echo "471047623451a0bd8c885dbd63bb660d0168e23c5393cf184f884091ff7c9233  $RUNNER_TEMP/aeneas.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/aeneas.tar.gz" -C "$RUNNER_TEMP/aeneas-dist" && echo "$RUNNER_TEMP/aeneas-dist" >> "$GITHUB_PATH"

      - name: Verify PostFork Rust build and Charon/Aeneas 0-diff extraction
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pf-regen"; mkdir -p "$RUNNER_TEMP/pf-regen"; export CARGO_TARGET_DIR="$RUNNER_TEMP/pf-cargo-target"
          (cd LeanSwe/PostFork/rust && cargo build --locked --release --features standalone && charon cargo --preset aeneas --opaque postfork::sys --dest-file "$RUNNER_TEMP/pf-regen/postfork.llbc")
          aeneas -backend lean -split-files -subdir LeanSwe.PostFork.Aeneas -use-lean-modules false -dest "$RUNNER_TEMP/pf-regen" "$RUNNER_TEMP/pf-regen/postfork.llbc"
          diff -u LeanSwe/PostFork/Aeneas/Types.lean "$RUNNER_TEMP/pf-regen/LeanSwe.PostFork.Aeneas/Types.lean"; diff -u LeanSwe/PostFork/Aeneas/Funs.lean "$RUNNER_TEMP/pf-regen/LeanSwe.PostFork.Aeneas/Funs.lean"

      - name: Build Lean libraries and tests
        id: build
        run: |
          set -euo pipefail
          lake exe cache get; LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake build --wfail; LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake build --wfail LeanSwe.PostFork.Verified lean-swe-mut-test leanswe-fuzz
          actual_syms=$(nm -u .lake/build/lib/libleanswe_postfork_rust.a | awk '$1 ~ /^[Uuwv]$/ { print $2 }' | sort -u)
          expected_syms=$(printf '%s\n' __errno_location _exit chdir close dup2 execve fcntl open read setpgid syscall write | sort -u)
          expected_c_syms=$(printf '%s\n' leanswe_postfork_host_close_fd leanswe_postfork_host_fork_run leanswe_postfork_host_pipe_cloexec leanswe_postfork_host_probe_fd leanswe_postfork_host_probe_handle leanswe_postfork_host_read_once leanswe_postfork_host_setpgid leanswe_postfork_host_wait_once leanswe_postfork_host_write_once | sort -u)
          diff -u <(printf '%s\n' "$expected_syms") <(printf '%s\n' "$actual_syms"); diff -u <(printf '%s\n' leanswe_postfork_close_fds_above2_except leanswe_postfork_run_child) <(nm --defined-only .lake/build/lib/libleanswe_postfork_rust.a | awk '$2 ~ /^[A-Z]$/ { print $3 }' | sort -u); diff -u <(printf '%s\n' "$expected_c_syms") <(nm --defined-only .lake/build/lib/libleanswe_postfork.a | awk '$2 ~ /^[ABCDGRST]$/ { print $3 }' | sort -u)
          for b in lean-swe-test lean-swe-mut-test leanswe-fuzz; do readelf -d ".lake/build/bin/$b" | grep -qE 'BIND_NOW|NOW'; done

      - name: Save Lean packages cache
        if: >-
          !cancelled() &&
          steps.lake-pkgs-cache.outputs.cache-hit != 'true' &&
          steps.build.outcome == 'success' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain', './lake-manifest.json') }}

      - name: Save build folder cache
        if: >-
          !cancelled() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.lake-cache.outputs.cache-hit != 'true' &&
          steps.build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ github.sha }}

      - name: Run runtime test suites
        run: |
          set -euo pipefail
          if [[ -f /sys/fs/cgroup/leanswe/runner/cgroup.procs ]]; then
            printf '%s\n' "$$" | sudo -n tee /sys/fs/cgroup/leanswe/runner/cgroup.procs >/dev/null || true
          fi
          python3 -c '
          import ctypes, os, pathlib, subprocess
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.argtypes = [ctypes.c_long, ctypes.c_void_p, ctypes.c_size_t, ctypes.c_uint32]
          libc.syscall.restype = ctypes.c_long
          ll = libc.syscall(444, None, 0, 1)
          lsm = pathlib.Path("/sys/kernel/security/lsm").read_text().strip() if pathlib.Path("/sys/kernel/security/lsm").exists() else "n/a"
          cg = pathlib.Path("/proc/self/cgroup").read_text().strip()
          bw = subprocess.run(["bwrap", "--ro-bind", "/", "/", "--dev", "/dev", "--proc", "/proc", "--tmpfs", "/tmp", "--unshare-all", "--", "/bin/true"], capture_output=True, text=True)
          line = f"SANDBOX_PROBE: kernel={os.uname().release} landlock_abi={ll} lsm={lsm} cgroup={cg} bwrap_rc={bw.returncode}"
          print(line)
          if bw.returncode != 0:
              print("SANDBOX_PROBE_BWRAP_ERR:", bw.stderr.strip())
          s = os.environ.get("GITHUB_STEP_SUMMARY")
          if s:
              with open(s, "a", encoding="utf-8") as f:
                  f.write(f"`{line}`\n\n")
          '
          ASSUMP_NONCE=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          ASSUMP_LOG="${RUNNER_TEMP:-/tmp}/assump-${GITHUB_RUN_ID:-local}.log"
          rm -f "$ASSUMP_LOG"
          echo "ASSUMP_NONCE=$ASSUMP_NONCE" >> "$GITHUB_ENV"
          echo "ASSUMP_LOG=$ASSUMP_LOG" >> "$GITHUB_ENV"
          .lake/build/bin/lean-swe-test --assump-log "$ASSUMP_LOG" --assump-nonce "$ASSUMP_NONCE"
          .lake/build/bin/leanswe-fuzz --sandbox-strace-fault-check; .lake/build/bin/leanswe-fuzz --suite sandbox --steps 100000 --self-test-shrink; .lake/build/bin/leanswe-fuzz --suite sandbox --steps 50000 --random-seed --self-test-shrink
          if sudo -n sysctl -n vm.memfd_noexec >/dev/null 2>&1; then
            OLD_MEMFD_NOEXEC=$(sudo -n sysctl -n vm.memfd_noexec)
            sudo -n unshare --pid --fork --mount-proc -- bash -ec '
              ulimit -Hc unlimited; if (( $1 == 2 )); then echo "MEMFD_NOEXEC_WARN: vm.memfd_noexec=2 enforced; skipping vm.memfd_noexec=1"; else
                sysctl -w vm.memfd_noexec=1 >/dev/null; setpriv --reuid="$2" --regid="$3" --init-groups -- .lake/build/bin/leanswe-fuzz --suite sandbox --steps 50000 --random-seed --self-test-shrink; sysctl -w vm.memfd_noexec=2 >/dev/null
              fi
              setpriv --reuid="$2" --regid="$3" --init-groups -- .lake/build/bin/leanswe-fuzz --suite sandbox --steps 50000 --random-seed --self-test-shrink --require-memfd-strict
              sysctl -w "vm.memfd_noexec=$1" >/dev/null 2>&1 || true' _ "$OLD_MEMFD_NOEXEC" "$(id -u)" "$(id -g)"
          else
            echo "::warning::sudo -n sysctl unavailable; skipping vm.memfd_noexec={1,2} strict checks"
          fi
          .lake/build/bin/leanswe-fuzz --timerand-strace-fault-check; .lake/build/bin/leanswe-fuzz --files-strace-fault-check; .lake/build/bin/lean-swe-test --suite Git --suite Compress --suite CmdLine --suite EnvVars.Raw --suite EnvVars --suite CryptoHash.Raw --suite CryptoHash --suite PostFork --suite Sqlite --suite Sqlite.Raw 0<&- 1>&- 2>&-; .lake/build/bin/leanswe-fuzz --smoke --suite sandbox,timerand,files,process,poll,net,passwd,dns --self-test-shrink 0<&- 1>&- 2>&-
          .lake/build/bin/lean-swe-mut-test --mode full --suite LinuxSyscall.Sandbox,LinuxSyscall.TimeRand,Compress,LinuxSyscall.Poll,LinuxSyscall.Net,Git,CmdLine,EnvVars.Raw,EnvVars,CryptoHash.Raw,CryptoHash,LinuxSyscall.Passwd,LinuxSyscall.Dns,LinuxSyscall.Files,PostFork,Sqlite,Sqlite.Raw
          .lake/build/bin/leanswe-fuzz --suite timerand --steps 100000 --self-test-shrink; .lake/build/bin/leanswe-fuzz --suite timerand --steps 100000 --random-seed --self-test-shrink
          .lake/build/bin/lean-swe-mut-test --mode full --suite LinuxSyscall.Process; .lake/build/bin/leanswe-fuzz --process-strace-fault-check; .lake/build/bin/leanswe-fuzz --suite process --steps 15000 --self-test-shrink --require-ns; .lake/build/bin/leanswe-fuzz --suite process --steps 5000 --random-seed --self-test-shrink --require-ns
          python3 -B -m unittest scripts/test_fuzz_changed.py
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${BASE_SHA:-}" ]]; then
            python3 -B scripts/fuzz_changed.py --base "$BASE_SHA" --head HEAD --check-manifest --run --extra-arg=--self-test-shrink
          else
            python3 -B scripts/fuzz_changed.py --base HEAD --head HEAD --check-manifest; .lake/build/bin/leanswe-fuzz --smoke --all --self-test-shrink
          fi
          .lake/build/bin/leanswe-fuzz --poll-strace-fault-check; .lake/build/bin/leanswe-fuzz --net-strace-fault-check; .lake/build/bin/leanswe-fuzz --suite poll --steps 50000 --self-test-shrink; .lake/build/bin/leanswe-fuzz --suite poll --steps 50000 --random-seed --self-test-shrink; .lake/build/bin/leanswe-fuzz --suite net --steps 50000 --self-test-shrink --require-ns; .lake/build/bin/leanswe-fuzz --suite net --seed 11262680905236430927 --steps 50000 --self-test-shrink --require-ns; .lake/build/bin/leanswe-fuzz --suite net --steps 50000 --random-seed --self-test-shrink --require-ns
          .lake/build/bin/leanswe-fuzz --suite postfork --steps 25000 --self-test-shrink; .lake/build/bin/leanswe-fuzz --suite postfork --steps 25000 --random-seed --self-test-shrink; .lake/build/bin/leanswe-fuzz --suite postfork --steps 500 --self-test-shrink 0<&- >/dev/null

      - name: Check 1 GB private-memory cap on changed modules and reverse dependents
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          DIFF_BASE="${BASE_SHA:-}"
          if [[ -z "$DIFF_BASE" && "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git fetch --no-tags --depth=1 origin -- "$PUSH_BEFORE" 2>/dev/null; then
              DIFF_BASE="$PUSH_BEFORE"
            fi
          fi
          if [[ -z "$DIFF_BASE" ]]; then
            echo "MEMORY_CHECK: no comparison base available; skipping incremental memory check"
            exit 0
          fi
          mapfile -t CHANGED_LEAN < <(
            git diff --name-only --diff-filter=ACMR "$DIFF_BASE" HEAD -- '*.lean' \
              | grep -vxF 'lakefile.lean' || true
          )
          if (( ${#CHANGED_LEAN[@]} == 0 )); then
            echo "MEMORY_CHECK: skipped (0 module .lean files changed against $DIFF_BASE)"
          else
            python3 -B scripts/check_proof_memory.py --with-revdeps --jobs "$LEAN_JOBS" -- "${CHANGED_LEAN[@]}"
          fi

      - name: Check spec promise theorem coverage
        run: lake env lean -DwarningAsError=true --run scripts/CheckPromises.lean .lake/build/lib/lean .

      - name: Check assumptions and error coverage
        run: lake env lean -DwarningAsError=true --run scripts/CheckAssumptions.lean --allow-legacy --verify-log "$ASSUMP_LOG" --nonce "$ASSUMP_NONCE"

      - name: Check assumptions self-tests
        run: lake env lean -DwarningAsError=true --run scripts/CheckAssumptionsTest.lean

      - name: Check non-Lean thinness gate
        run: lake env lean -DwarningAsError=true --run scripts/CheckForeignThinness.lean .

      - name: Run world-model differential fuzzer (Files)
        run: |
          set -euo pipefail
          .lake/build/bin/leanswe-fuzz --suite files --steps 100000 --self-test-shrink --require-ns
          .lake/build/bin/leanswe-fuzz --suite files --steps 50000 --random-seed --require-ns
          command -v capsh >/dev/null 2>&1 || { echo "ERROR: missing capsh" >&2; exit 1; }
          unshare -Urm sh -c '
            set -e; T=$(mktemp -d /tmp/gh-ovl.XXXXXX)
            trap "for p in \"$T/ro/s1777/u65534\" \"$T/ro\" \"$T/mnt\" \"$T/ul_mnt\" \"$T/root/proc\" \"$T/root/dev\" \"$T/m\"; do umount -l \"\$p\" 2>/dev/null || true; done; rm -rf \"$T\"" EXIT
            mkdir -p "$T/low" "$T/up" "$T/wk" "$T/mnt" "$T/x" "$T/m" "$T/ro_src" "$T/ro" "$T/ul_low/shrink" "$T/ul_up" "$T/ul_wk" "$T/ul_mnt" "$T/root/dev" "$T/root/proc" "$T/root/etc" "$T/root/sys/kernel/debug" "$T/out"
            ./.lake/build/bin/leanswe-fuzz --seed-overlay-lower "$T/low" 250; mount -t overlay overlay -o "lowerdir=$T/low,upperdir=$T/up,workdir=$T/wk,userxattr" "$T/mnt"; mount -t tmpfs tmpfs "$T/m"
            ./.lake/build/bin/leanswe-fuzz --worker-mode rw --host-protected --dir "$T/m" --steps 5000 --assert-worker-hits < /dev/null
            ./.lake/build/bin/leanswe-fuzz --worker-mode unlinked_cwd --host-protected --dir "$T/m" --steps 3000 --assert-worker-hits < /dev/null
            ./.lake/build/bin/leanswe-fuzz --worker-mode seccomp --host-protected --dir "$T/m" --steps 3000 --assert-worker-hits < /dev/null
            ./.lake/build/bin/leanswe-fuzz --seed-ro-tree "$T/ro_src"; : > "$T/ro_src/s1777/u65534"; mount --bind "$T/ro_src" "$T/ro"; mount -o remount,ro,bind "$T/ro"; mount --bind /etc/passwd "$T/ro/s1777/u65534"; mount -o remount,ro,bind "$T/ro/s1777/u65534"
            ./.lake/build/bin/leanswe-fuzz --worker-mode ro_bind --host-protected --dir "$T/ro" --steps 3000 --assert-worker-hits < /dev/null
            mount --rbind /dev "$T/root/dev"; mount --rbind /proc "$T/root/proc"; cp /etc/passwd "$T/root/etc/passwd"; : > "$T/root/sys/kernel/cpu_byteorder"
            ./.lake/build/bin/leanswe-fuzz --worker-mode chroot --host-protected --dir "$T/out" --chroot-dir "$T/root" --steps 3000 --assert-worker-hits < /dev/null
            i=0; while [ "$i" -lt 90 ]; do mkdir -p "$T/ul_low/ep-$i"; i=$((i+1)); done; j=0; while [ "$j" -lt 256 ]; do mkdir -p "$T/ul_low/shrink-$j"; j=$((j+1)); done
            : > "$T/ul_low/.ovl_unlinked"; mount -t overlay overlay -o "lowerdir=$T/ul_low,upperdir=$T/ul_up,workdir=$T/ul_wk,userxattr" "$T/ul_mnt"
            capsh --drop=cap_dac_override,cap_dac_read_search,cap_fowner,cap_fsetid -- -c "./.lake/build/bin/leanswe-fuzz --worker-mode unlinked_cwd --host-protected --preseeded-eps --dir \"$T/ul_mnt\" --steps 3000 --assert-worker-hits < /dev/null"
            capsh --drop=cap_dac_override,cap_dac_read_search,cap_fowner,cap_fsetid -- -c "./.lake/build/bin/leanswe-fuzz --worker-mode rw --host-protected --preseeded-eps --dir \"$T/mnt\" --cross-dir \"$T/x\" --steps 10000 --assert-worker-hits < /dev/null"
          '
