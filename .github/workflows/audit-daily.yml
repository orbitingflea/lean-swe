name: Daily audit gate

on:
  schedule:
    - cron: '17 06 * * *'
  workflow_dispatch:

concurrency:
  group: audit-daily-main
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit-daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare runner packages, swap, sandbox cgroup, and concurrency
        id: setup
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap strace uidmap python3-zstandard zstd xz-utils gzip curl libssl-dev xfsprogs btrfs-progs dosfstools exfatprogs
          [[ ! -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          U="$(id -un)"
          for f in /etc/subuid /etc/subgid; do
            if ! grep -q "^${U}:" "$f" 2>/dev/null; then
              S=$(awk -F: 'NF>=3 { if ($2+$3>m) m=$2+$3 } END { print m?m:100000 }' "$f" 2>/dev/null || echo 100000)
              flag=${f#/etc/sub}
              sudo usermod "--add-sub${flag}s" "${S}-$((S+65535))" "$U"
            fi
          done
          if [[ -f /sys/fs/cgroup/cgroup.controllers ]]; then
            echo "+memory +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null 2>&1 || true
            sudo mkdir -p /sys/fs/cgroup/leanswe/runner &&
              echo "+memory +pids" | sudo tee /sys/fs/cgroup/leanswe/cgroup.subtree_control >/dev/null &&
              sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/leanswe || true
          fi
          swapon --show || true
          if (( $(awk 'NR>1 {s+=$3} END {print s+0}' /proc/swaps) < 4000000 )); then
            if sudo fallocate -l 4G /swapfile_ci && sudo chmod 600 /swapfile_ci && sudo mkswap /swapfile_ci && sudo swapon /swapfile_ci; then
              swapon --show || true
            else
              sudo rm -f /swapfile_ci || true
              echo "SWAP_WARN: could not activate additional /swapfile_ci; continuing with existing swap"
            fi
          fi
          JOBS=$(python3 -c 'import os; print(max(1, min(os.cpu_count() or 2, 4)))')
          echo "LEAN_JOBS=$JOBS" >> "$GITHUB_ENV"
          echo "RUNNER_INFO: cpus=$(nproc) lean_jobs=$JOBS"
          free -m
          df -h /

      - name: Restore Lean packages cache
        id: lake-pkgs-cache
        if: steps.setup.outcome == 'success'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain', './lake-manifest.json', './proofs/lake-manifest.json') }}

      - name: Restore build folder cache
        id: lake-cache
        if: steps.setup.outcome == 'success'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ./.lake/build
            ./proofs/.lake/build
            ./harness/.lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-

      - name: Prune orphaned Lean build artifacts
        if: steps.setup.outcome == 'success'
        run: |
          python3 -c '
          from pathlib import Path
          import shutil
          for lib, base, roots in (
              (Path(".lake/build/lib/lean"), Path("."), ("Core", "LeanSwe", "Fuzz")),
              (Path("proofs/.lake/build/lib/lean"), Path("proofs"), ("LeanSwe", "LeanSweProofs")),
              (Path("harness/.lake/build/lib/lean"), Path("harness"), ("Fuzz", "ModelMutants", "UnitTests")),
          ):
              for r in roots:
                  if not (lr := lib / r).exists(): continue
                  if not (base / r).is_dir():
                      shutil.rmtree(lr)
                      continue
                  for o in list(lr.rglob("*.olean")):
                      if not (base / o.relative_to(lib).with_suffix(".lean")).is_file():
                          for ext in (".olean", ".olean.hash", ".olean.server", ".olean.private", ".ilean", ".ilean.hash", ".trace"): o.with_suffix(ext).unlink(missing_ok=True)
          '

      - name: Install Lean toolchain
        id: toolchain
        if: steps.setup.outcome == 'success'
        uses: ./.github/actions/install-lean

      - name: Check Lean import policy
        id: check_imports
        if: steps.setup.outcome == 'success' && steps.toolchain.outcome == 'success'
        run: |
          set -euo pipefail
          lean -DwarningAsError=true --run scripts/CheckImports.lean --self-test 2>&1 | tee "$RUNNER_TEMP/check_imports.log"
          lean -DwarningAsError=true --run scripts/CheckImports.lean . 2>&1 | tee -a "$RUNNER_TEMP/check_imports.log"

      - name: Install Rust toolchain, Charon, and Aeneas
        id: rust_aeneas
        if: steps.setup.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.check_imports.outcome == 'success'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 180 -o "$RUNNER_TEMP/rustup-init" https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
            echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  $RUNNER_TEMP/rustup-init" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/rustup-init" && "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH" && export PATH="$HOME/.cargo/bin:$PATH"
          fi
          (cd LeanSwe/PostFork/rust && rustup show active-toolchain >/dev/null 2>&1 || rustup toolchain install nightly-2026-09-17 --profile minimal --component rustc-dev llvm-tools rust-src)
          mkdir -p "$RUNNER_TEMP/aeneas-dist"
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 180 -o "$RUNNER_TEMP/aeneas.tar.gz" https://github.com/AeneasVerif/aeneas/releases/download/nightly-2026.11.11-0d21a9e/aeneas-linux-x86_64.tar.gz
          echo "471047623451a0bd8c885dbd63bb660d0168e23c5393cf184f884091ff7c9233  $RUNNER_TEMP/aeneas.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/aeneas.tar.gz" -C "$RUNNER_TEMP/aeneas-dist"
          echo "$RUNNER_TEMP/aeneas-dist" >> "$GITHUB_PATH"

      - name: Verify PostFork Rust build and Charon/Aeneas 0-diff extraction
        id: postfork_extract
        if: steps.setup.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.check_imports.outcome == 'success' && steps.rust_aeneas.outcome == 'success'
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/pf-cargo-target"
          (cd LeanSwe/PostFork/rust && cargo build --locked --release --features standalone)
          rm -rf "$RUNNER_TEMP/pf-regen"
          mkdir -p "$RUNNER_TEMP/pf-regen"
          (cd LeanSwe/PostFork/rust && charon cargo --preset aeneas --opaque postfork::sys --dest-file "$RUNNER_TEMP/pf-regen/postfork.llbc")
          aeneas -backend lean -split-files -subdir LeanSweProofs.PostFork.Aeneas -use-lean-modules false -dest "$RUNNER_TEMP/pf-regen" "$RUNNER_TEMP/pf-regen/postfork.llbc"
          diff -u proofs/LeanSweProofs/PostFork/Aeneas/Types.lean "$RUNNER_TEMP/pf-regen/LeanSweProofs.PostFork.Aeneas/Types.lean"
          diff -u proofs/LeanSweProofs/PostFork/Aeneas/Funs.lean "$RUNNER_TEMP/pf-regen/LeanSweProofs.PostFork.Aeneas/Funs.lean"

      - name: Run sandboxed lake check
        id: lake_check
        if: steps.setup.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.check_imports.outcome == 'success'
        run: |
          set -euo pipefail
          lake -d proofs exe cache get 2>&1 | tee "$RUNNER_TEMP/lake_check.log"
          LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake check 2>&1 | tee -a "$RUNNER_TEMP/lake_check.log"
          LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake -d proofs build --wfail 2>&1 | tee -a "$RUNNER_TEMP/lake_check.log"
          LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake -d proofs build --wfail LeanSweProofs.PostFork.Verified 2>&1 | tee -a "$RUNNER_TEMP/lake_check.log"
          PROOFS_EXPORT_FILE="$(mktemp "$RUNNER_TEMP/proofs-export.XXXXXX.ndjson")"
          trap 'rm -f "$PROOFS_EXPORT_FILE"' EXIT
          LEAN_PREFIX="$(lean --print-prefix)"
          lake -d proofs env "$LEAN_PREFIX/bin/leanexport" LeanSweProofs LeanSweProofs.PostFork.Verified > "$PROOFS_EXPORT_FILE"
          lake -d proofs check --from-export="$PROOFS_EXPORT_FILE" 2>&1 | tee -a "$RUNNER_TEMP/lake_check.log"
          rm -f "$PROOFS_EXPORT_FILE"
          trap - EXIT
          LAKE_NO_CACHE=true LEAN_NUM_THREADS="$LEAN_JOBS" lake -d harness build --wfail ModelMutants UnitTests leanswe-fuzz 2>&1 | tee -a "$RUNNER_TEMP/lake_check.log"
          actual_syms=$(nm -u .lake/build/lib/libleanswe_postfork_rust.a | awk '$1 ~ /^[Uuwv]$/ { print $2 }' | sort -u)
          expected_syms=$(printf '%s\n' __errno_location _exit chdir close dup2 execve fcntl open read setpgid syscall write | sort -u)
          expected_c_syms=$(printf '%s\n' leanswe_postfork_host_close_fd leanswe_postfork_host_fork_run leanswe_postfork_host_pipe_cloexec leanswe_postfork_host_probe_fd leanswe_postfork_host_probe_handle leanswe_postfork_host_read_once leanswe_postfork_host_setpgid leanswe_postfork_host_wait_once leanswe_postfork_host_write_once | sort -u)
          {
            diff -u <(printf '%s\n' "$expected_syms") <(printf '%s\n' "$actual_syms")
            diff -u <(printf '%s\n' leanswe_postfork_close_fds_above2_except leanswe_postfork_run_child) <(nm --defined-only .lake/build/lib/libleanswe_postfork_rust.a | awk '$2 ~ /^[A-Z]$/ { print $3 }' | sort -u)
            diff -u <(printf '%s\n' "$expected_c_syms") <(nm --defined-only .lake/build/lib/libleanswe_postfork.a | awk '$2 ~ /^[ABCDGRST]$/ { print $3 }' | sort -u)
            for b in leanswe-fuzz; do
              readelf -d "harness/.lake/build/bin/$b" | grep -E '^[[:space:]]*0x[0-9a-fA-F]+[[:space:]]+(\(BIND_NOW\)([[:space:]]|$)|\(FLAGS\)[[:space:]](.*[[:space:]])?BIND_NOW([[:space:]]|$)|\(FLAGS_1\)[[:space:]](.*[[:space:]])?NOW([[:space:]]|$))' >/dev/null || {
                echo "ERROR: harness/.lake/build/bin/$b missing ELF BIND_NOW" >&2
                exit 1
              }
            done
          } 2>&1 | tee -a "$RUNNER_TEMP/lake_check.log"

      - name: Save Lean packages cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.lake-pkgs-cache.outputs.cache-hit != 'true' && steps.lake_check.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ./.lake/packages
          key: lake-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain', './lake-manifest.json', './proofs/lake-manifest.json') }}

      - name: Save build folder cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true' && steps.lake_check.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ./.lake/build
            ./proofs/.lake/build
            ./harness/.lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./lean-toolchain') }}-${{ github.sha }}

      - name: Check 1 GB private-memory cap on all modules
        id: mem_check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.lake_check.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [[ ! -f .lake/build/lib/lean/LeanSwe.olean || ! -f proofs/.lake/build/lib/lean/LeanSweProofs.olean ]]; then
            echo "Skipping check_proof_memory.py because lake check did not produce LeanSwe.olean and proofs/.lake/build/lib/lean/LeanSweProofs.olean" | tee "$RUNNER_TEMP/mem_check.log"
            exit 1
          fi
          LAKE_NO_CACHE=true python3 -B scripts/check_proof_memory.py --jobs "$LEAN_JOBS" 2>&1 | tee "$RUNNER_TEMP/mem_check.log"

      - name: Check proved test promises
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.lake_check.outcome == 'success' && steps.mem_check.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake -d proofs env lean -DwarningAsError=true --run scripts/CheckPromises.lean .lake/build/lib/lean .

      - name: Check assumptions self-tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.lake_check.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake -d proofs env lean -DwarningAsError=true --run scripts/CheckAssumptionsTest.lean

      - name: Check non-Lean thinness gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.lake_check.outcome == 'success' }}
        run: |
          set -euo pipefail
          lake -d proofs env lean -DwarningAsError=true --run scripts/CheckForeignThinness.lean .
          python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Run differential fuzz suites
        id: repeat_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.lake_check.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [[ ! -x harness/.lake/build/bin/leanswe-fuzz ]]; then
            echo "Missing harness/.lake/build/bin/leanswe-fuzz after lake check" | tee "$RUNNER_TEMP/repeat_tests.log"
            exit 1
          fi
          if [[ -f /sys/fs/cgroup/leanswe/runner/cgroup.procs ]]; then
            printf '%s\n' "$$" | sudo -n tee /sys/fs/cgroup/leanswe/runner/cgroup.procs >/dev/null || true
          fi
          python3 -c '
          import ctypes, os, pathlib, subprocess
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.argtypes = [ctypes.c_long, ctypes.c_void_p, ctypes.c_size_t, ctypes.c_uint32]
          libc.syscall.restype = ctypes.c_long
          ll = libc.syscall(444, None, 0, 1)
          lsm = pathlib.Path("/sys/kernel/security/lsm").read_text().strip() if pathlib.Path("/sys/kernel/security/lsm").exists() else "n/a"
          cg = pathlib.Path("/proc/self/cgroup").read_text().strip()
          bw = subprocess.run(["bwrap", "--ro-bind", "/", "/", "--dev", "/dev", "--proc", "/proc", "--tmpfs", "/tmp", "--unshare-all", "--", "/bin/true"], capture_output=True, text=True)
          line = f"SANDBOX_PROBE: kernel={os.uname().release} landlock_abi={ll} lsm={lsm} cgroup={cg} bwrap_rc={bw.returncode}"
          print(line)
          if bw.returncode != 0:
              print("SANDBOX_PROBE_BWRAP_ERR:", bw.stderr.strip())
          s = os.environ.get("GITHUB_STEP_SUMMARY")
          if s:
              with open(s, "a", encoding="utf-8") as f:
                  f.write(f"`{line}`\n\n")
          ' | tee "$RUNNER_TEMP/repeat_tests.log"
          DAILY_NONCE=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          [[ "$DAILY_NONCE" =~ ^[0-9a-f]{32}$ ]] || { echo "DAILY_NONCE_ERROR: invalid nonce" >&2; exit 2; }
          DAILY_NONCE_FILE="$RUNNER_TEMP/daily.nonce"; FUZZ_COV_DIR="$RUNNER_TEMP/fuzz-cov"
          rm -rf "$FUZZ_COV_DIR" "$DAILY_NONCE_FILE"; mkdir -p "$FUZZ_COV_DIR"
          printf '%s\n' "$DAILY_NONCE" > "$DAILY_NONCE_FILE"
          {
            harness/.lake/build/bin/leanswe-fuzz --sandbox-strace-fault-check
            harness/.lake/build/bin/leanswe-fuzz --suite sandbox --steps 1000000 --self-test-shrink --coverage-log "$FUZZ_COV_DIR/sandbox.log" --nonce "$DAILY_NONCE"
            harness/.lake/build/bin/leanswe-fuzz --suite sandbox --steps 250000 --random-seed --self-test-shrink
          } 2>&1 | tee -a "$RUNNER_TEMP/repeat_tests.log"
          if sudo -n sysctl -n vm.memfd_noexec >/dev/null 2>&1; then
            OLD_MEMFD_NOEXEC=$(sudo -n sysctl -n vm.memfd_noexec)
            sudo -n unshare --pid --fork --mount-proc -- bash -ec '
              ulimit -Hc unlimited
              if (( $1 == 2 )); then
                echo "MEMFD_NOEXEC_WARN: vm.memfd_noexec=2 enforced; skipping vm.memfd_noexec=1"
              else
                sysctl -w vm.memfd_noexec=1 >/dev/null
                setpriv --reuid="$2" --regid="$3" --init-groups -- harness/.lake/build/bin/leanswe-fuzz --suite sandbox --steps 50000 --random-seed --self-test-shrink
                sysctl -w vm.memfd_noexec=2 >/dev/null
              fi
              setpriv --reuid="$2" --regid="$3" --init-groups -- harness/.lake/build/bin/leanswe-fuzz --suite sandbox --steps 50000 --random-seed --self-test-shrink --require-memfd-strict
              sysctl -w "vm.memfd_noexec=$1" >/dev/null 2>&1 || true
            ' _ "$OLD_MEMFD_NOEXEC" "$(id -u)" "$(id -g)" 2>&1 | tee -a "$RUNNER_TEMP/repeat_tests.log"
          else
            echo "::warning::sudo -n sysctl unavailable; skipping vm.memfd_noexec={1,2} strict checks" | tee -a "$RUNNER_TEMP/repeat_tests.log"
          fi
          {
            harness/.lake/build/bin/leanswe-fuzz --timerand-strace-fault-check
            harness/.lake/build/bin/leanswe-fuzz --smoke --suite sandbox,timerand,files,process,poll,net,passwd,dns --self-test-shrink 0<&- 1>&- 2>&-
            harness/.lake/build/bin/leanswe-fuzz --suite timerand --steps 1000000 --self-test-shrink --coverage-log "$FUZZ_COV_DIR/timerand.log" --nonce "$DAILY_NONCE"
            harness/.lake/build/bin/leanswe-fuzz --suite timerand --steps 250000 --random-seed --self-test-shrink
            stdbuf -oL -eL harness/.lake/build/bin/leanswe-fuzz --all --exclude sandbox,timerand,files,process,poll,net --steps 50000 --random-seed --self-test-shrink --coverage-log "$FUZZ_COV_DIR/other.log" --nonce "$DAILY_NONCE"
            harness/.lake/build/bin/leanswe-fuzz --poll-strace-fault-check
            harness/.lake/build/bin/leanswe-fuzz --net-strace-fault-check
            harness/.lake/build/bin/leanswe-fuzz --suite poll --steps 250000 --self-test-shrink --coverage-log "$FUZZ_COV_DIR/poll.log" --nonce "$DAILY_NONCE"
            harness/.lake/build/bin/leanswe-fuzz --suite poll --steps 750000 --random-seed --self-test-shrink
            harness/.lake/build/bin/leanswe-fuzz --suite net --steps 250000 --self-test-shrink --require-ns --coverage-log "$FUZZ_COV_DIR/net.log" --nonce "$DAILY_NONCE"
            harness/.lake/build/bin/leanswe-fuzz --suite net --seed 11262680905236430927 --steps 50000 --self-test-shrink --require-ns
            harness/.lake/build/bin/leanswe-fuzz --suite net --steps 750000 --random-seed --self-test-shrink --require-ns
            harness/.lake/build/bin/leanswe-fuzz --process-strace-fault-check
            harness/.lake/build/bin/leanswe-fuzz --suite process --steps 50000 --self-test-shrink --require-ns --coverage-log "$FUZZ_COV_DIR/process.log" --nonce "$DAILY_NONCE"
            harness/.lake/build/bin/leanswe-fuzz --suite process --steps 15000 --random-seed --self-test-shrink --require-ns
            harness/.lake/build/bin/leanswe-fuzz --suite postfork --steps 100000 --self-test-shrink
            harness/.lake/build/bin/leanswe-fuzz --suite postfork --steps 50000 --random-seed --self-test-shrink
            harness/.lake/build/bin/leanswe-fuzz --suite postfork --steps 500 --self-test-shrink 0<&- >/dev/null
          } 2>&1 | tee -a "$RUNNER_TEMP/repeat_tests.log"

      - name: Run Files world-model differential fuzzer and strace fault injection
        id: files_world_fuzz
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.lake_check.outcome == 'success' }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/files_world_fuzz.log"; FUZZ_COV_DIR="$RUNNER_TEMP/fuzz-cov"; mkdir -p "$FUZZ_COV_DIR"
          DAILY_NONCE=$([[ -s "$RUNNER_TEMP/daily.nonce" ]] && cat "$RUNNER_TEMP/daily.nonce" || python3 -c 'import secrets; print(secrets.token_hex(16))')
          harness/.lake/build/bin/leanswe-fuzz --files-strace-fault-check 2>&1 | tee "$LOG"
          harness/.lake/build/bin/leanswe-fuzz --suite files --steps 250000 --self-test-shrink --require-ns --coverage-log "$FUZZ_COV_DIR/files.log" --nonce "$DAILY_NONCE" 2>&1 | tee -a "$LOG"
          harness/.lake/build/bin/leanswe-fuzz --suite files --steps 60000 --random-seed --require-ns 2>&1 | tee -a "$LOG"
          command -v capsh >/dev/null 2>&1 || { echo "ERROR: missing capsh" >&2; exit 1; }
          unshare -Urm sh -c '
            set -e; T=$(mktemp -d /tmp/gh-ovl-daily.XXXXXX)
            trap "for p in \"$T/ro/s1777/u65534\" \"$T/ro\" \"$T/mnt\" \"$T/ul_mnt\" \"$T/root/proc\" \"$T/root/dev\" \"$T/m\"; do umount -l \"\$p\" 2>/dev/null || true; done; rm -rf \"$T\"" EXIT
            mkdir -p "$T/low" "$T/up" "$T/wk" "$T/mnt" "$T/x" "$T/m" "$T/ro_src" "$T/ro" "$T/ul_low/shrink" "$T/ul_up" "$T/ul_wk" "$T/ul_mnt" "$T/root/dev" "$T/root/proc" "$T/root/etc" "$T/root/sys/kernel/debug" "$T/out"
            ./harness/.lake/build/bin/leanswe-fuzz --seed-overlay-lower "$T/low" 400
            mount -t overlay overlay -o "lowerdir=$T/low,upperdir=$T/up,workdir=$T/wk,userxattr" "$T/mnt"
            mount -t tmpfs tmpfs "$T/m"
            ./harness/.lake/build/bin/leanswe-fuzz --worker-mode rw --host-protected --dir "$T/m" --steps 10000 --random-seed --assert-worker-hits < /dev/null
            ./harness/.lake/build/bin/leanswe-fuzz --worker-mode unlinked_cwd --host-protected --dir "$T/m" --steps 3000 --random-seed --assert-worker-hits < /dev/null
            ./harness/.lake/build/bin/leanswe-fuzz --worker-mode seccomp --host-protected --dir "$T/m" --steps 3000 --random-seed --assert-worker-hits < /dev/null
            ./harness/.lake/build/bin/leanswe-fuzz --seed-ro-tree "$T/ro_src"; : > "$T/ro_src/s1777/u65534"; mount --bind "$T/ro_src" "$T/ro"; mount -o remount,ro,bind "$T/ro"; mount --bind /etc/passwd "$T/ro/s1777/u65534"; mount -o remount,ro,bind "$T/ro/s1777/u65534"
            ./harness/.lake/build/bin/leanswe-fuzz --worker-mode ro_bind --host-protected --dir "$T/ro" --steps 3000 --random-seed --assert-worker-hits < /dev/null
            mount --rbind /dev "$T/root/dev"; mount --rbind /proc "$T/root/proc"; cp /etc/passwd "$T/root/etc/passwd"; : > "$T/root/sys/kernel/cpu_byteorder"
            ./harness/.lake/build/bin/leanswe-fuzz --worker-mode chroot --host-protected --dir "$T/out" --chroot-dir "$T/root" --steps 3000 --random-seed --assert-worker-hits < /dev/null
            i=0; while [ "$i" -lt 90 ]; do mkdir -p "$T/ul_low/ep-$i"; i=$((i+1)); done
            j=0; while [ "$j" -lt 256 ]; do mkdir -p "$T/ul_low/shrink-$j"; j=$((j+1)); done
            : > "$T/ul_low/.ovl_unlinked"; mount -t overlay overlay -o "lowerdir=$T/ul_low,upperdir=$T/ul_up,workdir=$T/ul_wk,userxattr" "$T/ul_mnt"
            capsh --drop=cap_dac_override,cap_dac_read_search,cap_fowner,cap_fsetid -- -c "./harness/.lake/build/bin/leanswe-fuzz --worker-mode unlinked_cwd --host-protected --preseeded-eps --dir \"$T/ul_mnt\" --steps 3000 --random-seed --assert-worker-hits < /dev/null"
            capsh --drop=cap_dac_override,cap_dac_read_search,cap_fowner,cap_fsetid -- -c "./harness/.lake/build/bin/leanswe-fuzz --worker-mode rw --host-protected --preseeded-eps --dir \"$T/mnt\" --cross-dir \"$T/x\" --steps 15000 --random-seed --assert-worker-hits < /dev/null"
          ' 2>&1 | tee -a "$LOG"
          sudo -n true 2>/dev/null || { echo "ERROR: passwordless sudo required for daily loopback FS audit" >&2; exit 1; }
          LOOP_T=""; MULTI_T=""; P_SYM=$(sysctl -n fs.protected_symlinks); P_FIF=$(sysctl -n fs.protected_fifos); P_REG=$(sysctl -n fs.protected_regular)
          cleanup_daily() {
            [[ -z "$LOOP_T" || ! -d "$LOOP_T" ]] || { sudo umount "$LOOP_T/mnt" 2>/dev/null || true; rm -rf "$LOOP_T"; }
            [[ -z "$MULTI_T" || ! -d "$MULTI_T" ]] || { for d in "$MULTI_T"/ro*; do sudo umount "$d" 2>/dev/null || true; done; sudo rm -rf "$MULTI_T"; }
            sudo sysctl -w "fs.protected_symlinks=$P_SYM" "fs.protected_fifos=$P_FIF" "fs.protected_regular=$P_REG" >/dev/null 2>&1 || true
          }
          trap cleanup_daily EXIT
          for fstype in ext4 xfs btrfs vfat exfat; do
            command -v "mkfs.$fstype" >/dev/null 2>&1 || { echo "ERROR: missing mkfs.$fstype" >&2; exit 1; }
            LOOP_T=$(mktemp -d /tmp/gh-loopfs.XXXXXX); truncate -s 320M "$LOOP_T/img"; "mkfs.$fstype" "$LOOP_T/img" >/dev/null 2>&1; mkdir -p "$LOOP_T/mnt"
            MOUNT_OPTS="loop"; if [[ "$fstype" == "vfat" || "$fstype" == "exfat" ]]; then MOUNT_OPTS="loop,uid=$(id -u),gid=$(id -g)"; fi
            sudo mount -o "$MOUNT_OPTS" "$LOOP_T/img" "$LOOP_T/mnt"
            sudo chown "$(id -u):$(id -g)" "$LOOP_T/mnt" 2>/dev/null || true
            harness/.lake/build/bin/leanswe-fuzz --suite files --dir "$LOOP_T/mnt" --steps 5000 --random-seed 2>&1 | tee -a "$LOG"
            harness/.lake/build/bin/leanswe-fuzz --seed-ro-tree "$LOOP_T/mnt/ro_tree"
            sudo umount "$LOOP_T/mnt"; sudo mount -o "$MOUNT_OPTS,ro" "$LOOP_T/img" "$LOOP_T/mnt"
            harness/.lake/build/bin/leanswe-fuzz --worker-mode ro_bind --dir "$LOOP_T/mnt/ro_tree" --steps 5000 --random-seed --assert-worker-hits 2>&1 | tee -a "$LOG"
            cleanup_daily; LOOP_T=""
          done
          MULTI_T=$(mktemp -d /tmp/gh-multi.XXXXXX)
          MYU=$(id -u); MYG=$(id -g); FU=$((MYU + 1)); FG=$((MYG + 1)); FU2=$((MYU + 2)); FG2=$((MYG + 2))
          for idx in $(seq 1 9); do
            PV=$((idx % 3)); PSYM=$((PV > 0 ? 1 : 0))
            sudo sysctl -w "fs.protected_symlinks=$PSYM" "fs.protected_fifos=$PV" "fs.protected_regular=$PV" >/dev/null
            harness/.lake/build/bin/leanswe-fuzz --seed-ro-tree "$MULTI_T/c$idx"
            for sd in s1777 s1002; do
              sudo ln -s ../sub/a "$MULTI_T/c$idx/$sd/sym_other"
              sudo chown -h "$FU:$FG" "$MULTI_T/c$idx/$sd/"*
              sudo chown "$FU2:$FG2" "$MULTI_T/c$idx/$sd"
            done
            mkdir -p "$MULTI_T/ro$idx"
            sudo mount --bind "$MULTI_T/c$idx" "$MULTI_T/ro$idx"; sudo mount -o remount,ro,bind "$MULTI_T/ro$idx"
            harness/.lake/build/bin/leanswe-fuzz --worker-mode ro_bind --dir "$MULTI_T/ro$idx" --steps 2000 --random-seed --assert-worker-hits 2>&1 | tee -a "$LOG"
            sudo umount "$MULTI_T/ro$idx"
            mkdir -p "$MULTI_T/rw$idx"
            sudo python3 - "$MULTI_T/rw$idx" "$MYU" "$MYG" "$FU" "$FG" "$FU2" "$FG2" <<'PY'
          import os, socket, sys
          rw, myu, myg, fu, fg, fu2, fg2 = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), int(sys.argv[4]), int(sys.argv[5]), int(sys.argv[6]), int(sys.argv[7])
          dirs = [f"{rw}/ep-{i}" for i in range(45)] + [f"{rw}/shrink-{i}" for i in range(256)]
          for d in dirs:
              os.makedirs(d, exist_ok=True)
              os.chown(d, myu, myg)
              gd = f"{d}/gd"
              os.makedirs(gd, exist_ok=True)
              os.chown(gd, myu, fg); os.chmod(gd, 0o2755)
              for sd, sm in [("s1777", 0o1777), ("s1002", 0o1002)]:
                  s = f"{d}/{sd}"
                  os.makedirs(s, exist_ok=True)
                  for fn, md, gg in [("reg666", 0o666, fg), ("f640", 0o640, myg), ("f604", 0o604, myg), ("g640", 0o640, fg), ("g604", 0o604, fg)]:
                      open(f"{s}/{fn}", "w").write("sticky\n"); os.chown(f"{s}/{fn}", fu, gg); os.chmod(f"{s}/{fn}", md)
                  os.mkfifo(f"{s}/fifo666"); os.chown(f"{s}/fifo666", fu, fg); os.chmod(f"{s}/fifo666", 0o666)
                  os.symlink("../sub/a", f"{s}/sym_other"); os.lchown(f"{s}/sym_other", fu, fg)
                  sk = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM); os.chdir(s); sk.bind("sock666"); sk.close()
                  os.chown(f"{s}/sock666", fu, fg); os.chmod(f"{s}/sock666", 0o666); os.chown(s, fu2, fg2); os.chmod(s, sm)
          PY
            harness/.lake/build/bin/leanswe-fuzz --worker-mode rw --preseeded-eps --dir "$MULTI_T/rw$idx" --steps 2000 --random-seed --assert-worker-hits 2>&1 | tee -a "$LOG"
          done
          trap - EXIT; cleanup_daily

      - name: Verify fuzzer coverage logs
        id: verify_fuzz_cov
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.lake_check.outcome == 'success' && steps.repeat_tests.outcome == 'success' && steps.files_world_fuzz.outcome == 'success' }}
        run: |
          set -euo pipefail
          [[ -s "$RUNNER_TEMP/daily.nonce" ]] || { echo "ERROR: missing $RUNNER_TEMP/daily.nonce" >&2; exit 1; }
          DAILY_NONCE=$(< "$RUNNER_TEMP/daily.nonce"); FUZZ_COV_DIR="$RUNNER_TEMP/fuzz-cov"
          lake -d proofs env lean -DwarningAsError=true --run scripts/CheckAssumptions.lean --nonce "$DAILY_NONCE" --require-fuzz-equiv --coverage-log "$FUZZ_COV_DIR/sandbox.log" --coverage-log "$FUZZ_COV_DIR/timerand.log" --coverage-log "$FUZZ_COV_DIR/other.log" --coverage-log "$FUZZ_COV_DIR/poll.log" --coverage-log "$FUZZ_COV_DIR/net.log" --coverage-log "$FUZZ_COV_DIR/process.log" --coverage-log "$FUZZ_COV_DIR/files.log" 2>&1 | tee "$RUNNER_TEMP/verify_fuzz_cov.log"

      - name: Open deduplicated GitHub issue on failure
        if: ${{ failure() && !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_SETUP: ${{ steps.setup.outcome }}
          OUT_TOOLCHAIN: ${{ steps.toolchain.outcome }}
          OUT_IMPORTS: ${{ steps.check_imports.outcome }}
          OUT_RUST: ${{ steps.rust_aeneas.outcome }}
          OUT_EXTRACT: ${{ steps.postfork_extract.outcome }}
          OUT_CHECK: ${{ steps.lake_check.outcome }}
          OUT_MEM: ${{ steps.mem_check.outcome }}
          OUT_TEST: ${{ steps.repeat_tests.outcome }}
          OUT_FILES_FUZZ: ${{ steps.files_world_fuzz.outcome }}
          OUT_FUZZ_COV: ${{ steps.verify_fuzz_cov.outcome }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,url | python3 -c 'import json,sys; rows=[r for r in json.load(sys.stdin) if r["title"].startswith("[audit-daily] Daily audit gate failed")]; print(rows[0]["url"] if rows else "")')
          if [[ -n "$EXISTING" ]]; then echo "Open issue already exists ($EXISTING); skipping duplicate creation."; exit 0; fi
          python3 -c '
          import os, pathlib, subprocess
          sha, repo, server, run_id = os.environ["GITHUB_SHA"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_RUN_ID"]
          outcomes = ", ".join(f"{l}=`{os.environ[k]}`" for l, k in (("setup","OUT_SETUP"),("toolchain","OUT_TOOLCHAIN"),("check_imports","OUT_IMPORTS"),("rust","OUT_RUST"),("extract","OUT_EXTRACT"),("lake_check","OUT_CHECK"),("mem_check","OUT_MEM"),("repeat_tests","OUT_TEST"),("files_fuzz","OUT_FILES_FUZZ"),("verify_fuzz_cov","OUT_FUZZ_COV")))
          temp, tails = pathlib.Path(os.environ["RUNNER_TEMP"]), []
          for name in ("check_imports", "lake_check", "mem_check", "repeat_tests", "files_world_fuzz", "verify_fuzz_cov"):
              p = temp / f"{name}.log"
              if p.exists():
                  lines = [ln[:320] for ln in p.read_text(encoding="utf-8", errors="replace").splitlines()[-60:]]
                  tails.append(f"### {name} (last {len(lines)} lines)\n````text\n" + "\n".join(lines) + "\n````")
          body = "\n\n".join([f"Daily audit gate failed on `main` at `{sha}`.", f"- Run: {server}/{repo}/actions/runs/{run_id}", f"- Outcomes: {outcomes}", *tails]).replace("@", "@\u200b")
          subprocess.run(["gh", "issue", "create", "--repo", repo, "--title", f"[audit-daily] Daily audit gate failed on main ({sha[:8]})", "--body", body], check=True)
          '
